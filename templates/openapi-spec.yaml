# OpenAPI 3.1 契约模板
#
# 用途:`.planning/context/openapi.yaml`
#
# 这是讨论阶段的产出,作为 AI 自动构建的输入。
# 模板故意**留空**——所有具体内容由讨论对话填充。
#
# 非 HTTP 项目(插件 / CLI / MCP 工具 / 库):OpenAPI 仍是规范语言,但字段按
# "转译表"理解,不硬套 HTTP 假设——完整转译表见 workflows/design.md 步骤 3:
#   servers → 宿主与入口(vscode://<id> / bin://<cmd> / mcp://<server>)
#   paths   → 能力标识(命令 / 工具 / 公开函数)
#   动词     → 操作语义(查询/执行/删除),不字面实现 HTTP
#   responses → 返回值与错误通道(错误码 / 异常 / Envelope)
#   认证/分页/速率限制 → 宿主权限模型;不适用的省略,不发明
# 且 info.description 首行写明"非 HTTP 项目,契约字段按转译表理解"。

openapi: 3.1.0
info:
  title: [项目名]
  version: 0.1.0
  description: |
    [一段话:这个 API 提供什么能力,为谁服务]
  contact:
    name: [团队/联系人]

servers:
  - url: http://localhost:3000
    description: 本地开发
  # - url: https://api.example.com
  #   description: 生产环境

# ============================================================
# 标签:对端点分组(可选,但建议)
# ============================================================
tags:
  - name: [资源名]
    description: [该组端点的用途]

# ============================================================
# 端点:讨论产出的核心
# ============================================================
paths:
  /resources:
    get:
      tags: [Resources]
      summary: 列出所有资源
      description: |
        [支持分页、过滤、排序]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Resource' }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

    post:
      tags: [Resources]
      summary: 创建资源
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceCreate' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /resources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [Resources]
      summary: 获取单个资源
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [Resources]
      summary: 更新资源
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceUpdate' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Resources]
      summary: 删除资源
      responses:
        '204': { description: 删除成功 }
        '404': { $ref: '#/components/responses/NotFound' }

# ============================================================
# 数据模型:实体定义
# ============================================================
components:
  schemas:
    Resource:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        status:
          type: string
          enum: [draft, active, archived]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ResourceCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }

    ResourceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        status:
          type: string
          enum: [draft, active, archived]

    # 标准错误响应
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true

  # 响应复用
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 资源冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }